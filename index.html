    <style>
        :root {
            --sidebar-width: 320px;
            --primary-color: #ffafcc;
            --secondary-color: #bde0fe;
            --bg-color: #fff0f3;
            --text-color: #5e548e;
            --accent-color: #ffc8dd;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Quicksand', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        /* 側邊欄樣式 */
        .sidebar {
            width: var(--sidebar-width);
            background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-header {
            padding: 30px 20px;
            border-bottom: 1px solid #eee;
            background: linear-gradient(135deg, #ffafcc 0%, #cdb4db 100%);
            color: white;
            text-align: center;
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 1.4rem;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .student-info {
            margin-top: 10px;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.3);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        .menu-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px;
        }

        ul { list-style: none; padding: 0; }

        li { margin-bottom: 8px; }

        a {
            text-decoration: none;
            color: var(--text-color);
            padding: 14px 15px;
            border-radius: 15px;
            display: block;
            transition: all 0.3s ease;
            font-weight: 500;
            margin: 5px 0;
        }

        a:hover {
            background-color: var(--accent-color);
            color: white;
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(255, 175, 204, 0.3);
        }

        /* 右側內容區樣式 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background-color: var(--bg-color);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
